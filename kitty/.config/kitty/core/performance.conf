# =============================================================================
#  performance.conf — latency & throughput tuning
# =============================================================================

# Delay (ms) between screen updates. Lower = smoother but more CPU/GPU.
# 10 targets ~100fps; raise to 16 if you want to save power on a laptop.
repaint_delay 10

# Delay (ms) before kitty processes input after a key/paste. 3 is snappy.
input_delay 3

# Sync screen updates to the monitor refresh rate. Removes tearing with
# negligible cost. Keep yes; set no only when chasing minimum input latency.
sync_to_monitor yes

# Render at most this many frames per second. 0 = unlimited (uses
# repaint_delay). Leave default for best smoothness.

# Number of lines of scrollback kept in RAM. Large values cost memory.
# 10k is a good balance; overflow goes to the pager below.
scrollback_lines 10000

# Pager for full scrollback (g in scrollback). Less, no init file, raw.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Bytes of scrollback stored on disk in the pager temp file. 0 = unlimited.
scrollback_pager_history_size 0

# Disable shell integration's cursor/title work if you want raw speed.
# Keep enabled — it powers prompt marks and is cheap.
shell_integration enabled

# Wayland/X: redraw the screen only when needed. Saves GPU on idle.
# (kitty handles this internally; no option needed.)
