# =============================================================================
#  general.conf — shell, bell, mouse, clipboard, misc behavior
# =============================================================================

# --- Shell ---
# Use the login shell by default. Override per-OS if needed.
shell .
editor .

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "

# --- Mouse ---
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes
copy_on_select no
strip_trailing_spaces smart
click_interval -1.0
focus_follows_mouse no
pointer_shape_when_grabbed arrow

# --- Selection ---
select_by_word_characters @-./_~?&=%+#

# --- Clipboard ---
clipboard_control write-clipboard write-primary read-clipboard read-primary
clipboard_max_size 64
# Confirm large/multiline pastes; quote URLs pasted at the shell prompt.
paste_actions quote-urls-at-prompt,confirm

# --- Performance-neutral conveniences ---
allow_remote_control yes
listen_on unix:@mykitty
update_check_interval 0
confirm_os_window_close 0

# --- Terminal type ---
term xterm-kitty
