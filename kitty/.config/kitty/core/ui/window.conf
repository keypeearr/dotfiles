# =============================================================================
#  window.conf — layouts, padding, opacity, borders
# =============================================================================

# --- Layouts ---
enabled_layouts splits,stack,tall,fat,grid

# --- Padding & margins ---
window_padding_width 0
window_margin_width 0
single_window_margin_width -1
placement_strategy center

# --- Borders ---
window_border_width 1.0pt
draw_minimal_borders yes
active_border_color #b4befe
inactive_border_color #6c7086

# --- Opacity & blur (matched to wezterm: opacity 0.8, macos blur 20) ---
# Blur costs GPU; wezterm runs 20, kitty's scale tops out near 64. 20 matches.
background_opacity 0.8
background_blur 20
dynamic_background_opacity yes

# --- Inactive window dimming ---
inactive_text_alpha 1.0

# --- New OS window default size ---
remember_window_size yes
initial_window_width 120c
initial_window_height 32c

# --- Decorations (cross-platform; matches wezterm RESIZE: no titlebar) ---
# Generic option — set here, NOT in os/*.conf (it would leak across OSes).
# titlebar-only: hide title bar, keep a resizable border + rounded corners.
# Override to `yes` (fully borderless) per-machine in local/*.conf if wanted.
hide_window_decorations titlebar-only

# --- Resize behavior ---
resize_in_steps no
confirm_os_window_close 0
