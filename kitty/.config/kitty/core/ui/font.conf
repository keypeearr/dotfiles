# =============================================================================
#  font.conf — typography
# =============================================================================
#  Font size is set per-OS in os/linux.conf and os/macos.conf because HiDPI
#  scaling differs (Retina vs typical Linux DPI). Family/features live here.
# =============================================================================

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Default size; per-OS files override for correct visual scale.
font_size 14.0

# Vertical padding between lines (px-ish adjustment, 0 = font default).
adjust_line_height 0
adjust_column_width 0

# Enable common ligatures, but disable them under the cursor so editing
# stays legible. Set to 'always' if you dislike the cursor exception.
disable_ligatures cursor

# Nerd Font glyphs (Powerline, icons) come from the font_family itself —
# "JetBrainsMono Nerd Font Mono" bundles them, so no symbol_map needed.
# Install on a new machine: brew install --cask font-jetbrains-mono-nerd-font
# (Arch: pacman -S ttf-jetbrains-mono-nerd).

# Render unicode box-drawing chars with kitty's own crisp geometry.
# (Default behavior; kept explicit for clarity.)
text_composition_strategy platform
