# =============================================================================
#  cursor.conf
# =============================================================================

cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0

# Blink interval (s). -1 = follow system. 0 = no blink (saves a redraw).
# 0 is the perf-friendly choice.
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# Trail effect: 0 disables (default, cheapest). Set ~1 for a subtle trail.
cursor_trail 0
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
