# =============================================================================
#  os/macos.conf — macOS. Ignored on Linux.
# =============================================================================

# NOTE: font_size is a generic (non-platform) option, so it cannot live here —
# it would leak across OSes. Set it in core/ui/font.conf, or per-machine in
# local/*.conf (see end of kitty.conf).

# --- Titlebar ---
# NOTE: hide_window_decorations is generic (would leak to Linux) — set once in
# core/ui/window.conf. macos_titlebar_color/show_window_title_in are gated here.
macos_titlebar_color system
macos_show_window_title_in window

# --- Performance: render at full screen refresh, don't throttle when hidden
#     more than necessary. Disabling traditional fullscreen avoids the slow
#     macOS fullscreen animation/space-switch. ---
macos_traditional_fullscreen no

# --- Keyboard ---
# Keep the right Option as a modifier-free Alt for Unicode entry; left Option
# acts as Alt for terminal use. 'no' = both produce composed chars.
macos_option_as_alt left

# --- Misc macOS niceties ---
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0.0
macos_custom_beam_cursor no

# Don't let macOS App Nap throttle a background kitty doing work.
macos_colorspace srgb
