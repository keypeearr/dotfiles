# =============================================================================
#  os/linux.conf — Arch Linux (Wayland + X11). Ignored on macOS.
# =============================================================================

# NOTE: font_size is a generic (non-platform) option, so it cannot live here —
# it would leak across OSes. Set it in core/ui/font.conf, or per-machine in
# local/*.conf (see end of kitty.conf).

# --- Wayland ---
# Use the system titlebar/decorations from the compositor.
wayland_titlebar_color system
# Server-side decorations: 'yes' lets the compositor draw borders (lighter
# than kitty drawing them). Use 'no' for a borderless tiling-WM look.
linux_display_server auto

# NOTE: hide_window_decorations and paste_actions are generic (non-platform)
# options — they'd leak across OSes from here. Decorations are set once in
# core/ui/window.conf; paste_actions in core/general.conf. For a fully
# borderless tiling-WM look, set `hide_window_decorations yes` in local/*.conf.

# --- Input latency: skip IME wiring if you don't use one (saves a hop) ---
wayland_enable_ime no

# Font Size
font_size 16.0
