# =============================================================================
#  kitty.conf — orchestrator
# =============================================================================
#  Modular, cross-platform (Arch Linux + macOS), performance-tuned.
#
#  Platform note: kitty silently ignores options that do not apply to the
#  current OS (macos_*, wayland_*, linux_*). Both OS files are included
#  unconditionally — only the matching one takes effect.
#
#  Reload live config: ctrl+shift+f5  (Linux) / cmd+ctrl+, (macOS)
# =============================================================================

# --- Core behavior ---
include core/performance.conf
include core/general.conf

# --- UI ---
include core/ui/font.conf
include core/ui/window.conf
include core/ui/cursor.conf
include core/ui/tabs.conf

# --- Theme (Catppuccin Mocha) ---
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include core/ui/theme.conf
# END_KITTY_THEME

# --- Background override (matched to wezterm: Black Metal (Burzum)) ---
# Must load AFTER theme.conf to win over its Catppuccin background.
# Keeps Catppuccin's foreground/ANSI palette, swaps base to pure black.
background #000000

# --- Per-OS overrides (only matching OS applies) ---
include os/linux.conf
include os/macos.conf

# --- Keybindings ---
include keymaps/keybindings.conf

# --- Per-machine overrides (gitignored) ---
# Drop any host-specific tweaks (e.g. font_size for this monitor's DPI) into
# local/<anything>.conf. Loaded last so it wins. Missing dir is fine.
globinclude local/*.conf
